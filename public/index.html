<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Pessoas - CRUD com Cálculo de Idade</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 1.25rem;
      font-weight: 600;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      align-items: end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
    }

    input {
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    button.btn-primary {
      background: var(--primary);
      color: white;
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 0.375rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    button.btn-primary:hover {
      background: var(--primary-hover);
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      display: none;
      margin-top: 1rem;
    }

    .alert-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: #f1f5f9;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-age {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .btn-delete {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.3rem 0.6rem;
      border-radius: 0.25rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
    }

    .empty-message {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Gestão de Pessoas (CRUD)</h1>
      <p>Aplicação com cálculo dinâmico de idade desenvolvida para CI/CD</p>
    </header>

    <!-- Formulário de Cadastro -->
    <section class="card">
      <h2>Cadastrar Pessoa</h2>
      <form id="user-form">
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" required>
        </div>

        <div class="form-group">
          <label for="name">Nome Completo</label>
          <input type="text" id="name" placeholder="Ex: João da Silva" required>
        </div>

        <div class="form-group">
          <label for="birthDate">Data de Nascimento</label>
          <input type="date" id="birthDate" required>
        </div>

        <button type="submit" class="btn-primary">Cadastrar</button>
      </form>
      <div id="alert-msg" class="alert"></div>
    </section>

    <!-- Listagem de Pessoas -->
    <section class="card">
      <h2>Pessoas Cadastradas</h2>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>CPF</th>
              <th>Nome</th>
              <th>Data Nasc.</th>
              <th>Idade</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <!-- Linhas geradas via JavaScript -->
          </tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-message" style="display: none;">
        Nenhuma pessoa cadastrada ainda.
      </div>
    </section>
  </div>

  <script>
    const form = document.getElementById('user-form');
    const tableBody = document.getElementById('user-table-body');
    const emptyState = document.getElementById('empty-state');
    const alertMsg = document.getElementById('alert-msg');

    function showAlert(message, isError = false) {
      alertMsg.textContent = message;
      alertMsg.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
      alertMsg.style.display = 'block';
      setTimeout(() => {
        alertMsg.style.display = 'none';
      }, 4000);
    }

    async function loadUsers() {
      try {
        const res = await fetch('/users');
        const users = await res.json();

        tableBody.innerHTML = '';

        if (!users || users.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';

        users.forEach(user => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${user.cpf}</strong></td>
            <td>${user.name}</td>
            <td>${user.birthDate}</td>
            <td><span class="badge-age">${user.age} anos</span></td>
            <td>
              <button class="btn-delete" onclick="deleteUser('${user.cpf}')">Excluir</button>
            </td>
          `;
          tableBody.appendChild(tr);
        });
      } catch (err) {
        console.error('Erro ao carregar usuários:', err);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const cpf = document.getElementById('cpf').value.trim();
      const name = document.getElementById('name').value.trim();
      const birthDate = document.getElementById('birthDate').value;

      try {
        const res = await fetch('/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cpf, name, birthDate })
        });

        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error || 'Erro ao cadastrar pessoa', true);
          return;
        }

        showAlert(`Pessoa cadastrada com sucesso! Idade calculada: ${data.age} anos`);
        form.reset();
        loadUsers();
      } catch (err) {
        showAlert('Erro de conexão com o servidor', true);
      }
    });

    async function deleteUser(cpf) {
      if (!confirm(`Deseja realmente excluir a pessoa com CPF ${cpf}?`)) return;

      try {
        const res = await fetch(`/users/${cpf}`, { method: 'DELETE' });
        if (res.ok) {
          showAlert('Pessoa excluída com sucesso!');
          loadUsers();
        } else {
          showAlert('Erro ao excluir pessoa', true);
        }
      } catch (err) {
        showAlert('Erro de conexão ao excluir', true);
      }
    }

    // Carrega a listagem ao abrir a página
    loadUsers();
  </script>
</body>
</html>
